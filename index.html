<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夢幻連點 & 火柴人拳擊擂台</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Outfit & Noto Sans TC -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    
    /* 夢幻漸層背景動畫 */
    .dreamy-bg {
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab, #a855f7, #ec4899);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 毛玻璃效果 */
    .glass-card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
    }

    /* 浮動動態粒子/愛心 */
    .particle {
      position: absolute;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      font-weight: bold;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
      }
      50% {
        transform: translate(-50%, -100%) scale(1.3) rotate(15deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -160%) scale(1) rotate(-15deg);
      }
    }

    /* 按鈕點擊按壓特效 */
    .click-btn {
      transition: all 0.05s ease;
    }
    .click-btn:active {
      transform: scale(0.94) !important;
    }

    /* 拳擊文字打擊特效 */
    .hit-text {
      position: absolute;
      font-weight: 900;
      font-size: 2rem;
      pointer-events: none;
      animation: popText 0.5s ease-out forwards;
    }

    @keyframes popText {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
      50% { transform: translate(-50%, -80%) scale(1.4); }
      100% { opacity: 0; transform: translate(-50%, -120%) scale(1); }
    }
  </style>
</head>
<body class="dreamy-bg min-h-screen flex items-center justify-center p-4 relative overflow-hidden text-slate-800">

  <!-- ================= 遊戲 1：夢幻連點大賽 ================= -->
  <div id="game1-container" class="w-full max-w-xl glass-card rounded-3xl p-6 md:p-8 text-center relative z-10 transition-all duration-500">
    <!-- 標頭資訊 -->
    <div class="mb-4">
      <span class="inline-block bg-white/40 text-purple-900 font-extrabold px-4 py-1.5 rounded-full text-sm shadow-sm backdrop-blur-sm">
        ✨ 夢幻手速對決
      </span>
      <h1 class="text-3xl md:text-4xl font-black text-white drop-shadow-md mt-2 tracking-wide">
        人機連點大賽
      </h1>
    </div>

    <!-- 計時器與 CPS 狀態 -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="bg-white/30 rounded-2xl p-3 backdrop-blur-sm border border-white/40">
        <p class="text-xs text-white/80 font-bold uppercase tracking-wider">剩餘時間</p>
        <p id="timer" class="text-2xl md:text-3xl font-black text-amber-300 drop-shadow">10.0s</p>
      </div>
      <div class="bg-white/30 rounded-2xl p-3 backdrop-blur-sm border border-white/40">
        <p class="text-xs text-white/80 font-bold uppercase tracking-wider">您的點擊 (CPS)</p>
        <p id="player-cps" class="text-2xl md:text-3xl font-black text-pink-200 drop-shadow">0.0</p>
      </div>
      <div class="bg-white/30 rounded-2xl p-3 backdrop-blur-sm border border-white/40">
        <p class="text-xs text-white/80 font-bold uppercase tracking-wider">AI 點擊 (CPS)</p>
        <p id="ai-cps" class="text-2xl md:text-3xl font-black text-cyan-200 drop-shadow">0.0</p>
      </div>
    </div>

    <!-- 進度條 PK -->
    <div class="space-y-4 mb-6">
      <!-- 玩家進度條 -->
      <div>
        <div class="flex justify-between text-sm font-bold text-white mb-1 px-1">
          <span class="flex items-center gap-1">👑 玩家 (您)</span>
          <span id="player-score" class="text-lg text-pink-200">0 次</span>
        </div>
        <div class="w-full bg-black/20 h-5 rounded-full overflow-hidden p-1 backdrop-blur-sm">
          <div id="player-bar" class="bg-gradient-to-r from-pink-400 to-rose-400 h-full rounded-full transition-all duration-100 shadow-inner" style="width: 0%"></div>
        </div>
      </div>

      <!-- AI 進度條 -->
      <div>
        <div class="flex justify-between text-sm font-bold text-white mb-1 px-1">
          <span class="flex items-center gap-1">🤖 AI 電腦 (約 5 CPS)</span>
          <span id="ai-score" class="text-lg text-cyan-200">0 次</span>
        </div>
        <div class="w-full bg-black/20 h-5 rounded-full overflow-hidden p-1 backdrop-blur-sm">
          <div id="ai-bar" class="bg-gradient-to-r from-cyan-400 to-blue-400 h-full rounded-full transition-all duration-100 shadow-inner" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- 點擊主要區域 -->
    <div class="relative mb-4">
      <button id="click-area" disabled class="click-btn w-full h-44 md:h-52 rounded-3xl bg-gradient-to-tr from-pink-400/80 via-purple-400/80 to-indigo-400/80 hover:from-pink-400 hover:to-indigo-400 text-white font-black text-2xl md:text-3xl shadow-xl flex flex-col items-center justify-center gap-2 border-2 border-white/50 disabled:opacity-60 disabled:cursor-not-allowed active:scale-95 transition cursor-pointer relative overflow-hidden">
        <span id="click-btn-text" class="drop-shadow-lg">準備開局...</span>
        <span id="combo-badge" class="hidden bg-yellow-300 text-purple-900 text-xs px-3 py-1 rounded-full font-black animate-bounce shadow">
          COMBO x0 🔥
        </span>
      </button>
    </div>

    <!-- 開局按鈕 -->
    <button id="start-btn" onclick="startClickGame()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-300 via-pink-400 to-rose-400 text-white font-extrabold text-xl shadow-lg hover:brightness-110 active:scale-98 transition">
      🚀 開始 10 秒對決
    </button>
  </div>

  <!-- 夢幻連點 - 結算彈窗 -->
  <div id="click-modal" class="hidden fixed inset-0 bg-purple-950/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="glass-card max-w-md w-full rounded-3xl p-6 text-center text-white border border-white/50 shadow-2xl">
      <!-- 醒目的「你很厲害嗎？」標題 -->
      <div class="bg-amber-300/20 border-2 border-amber-300/60 rounded-2xl p-4 mb-4">
        <h2 id="taunt-main" class="text-3xl md:text-4xl font-black text-yellow-300 drop-shadow-md tracking-wider animate-bounce">
          你很厲害嗎？ 🔥
        </h2>
      </div>

      <div id="result-emoji" class="text-5xl mb-1">🎉</div>
      <h3 id="result-title" class="text-2xl font-bold mb-1">比賽結束！</h3>
      
      <div class="bg-white/20 rounded-2xl p-4 my-4 space-y-2 text-left backdrop-blur-sm text-sm">
        <div class="flex justify-between">
          <span class="text-white/80">您的點擊數：</span>
          <span id="final-player" class="font-bold text-pink-200">0 次</span>
        </div>
        <div class="flex justify-between">
          <span class="text-white/80">AI 點擊數：</span>
          <span id="final-ai" class="font-bold text-cyan-200">0 次</span>
        </div>
        <div class="flex justify-between border-t border-white/20 pt-2 text-base">
          <span class="font-bold">連點差距：</span>
          <span id="final-diff" class="font-black text-yellow-300">0 次</span>
        </div>
      </div>

      <div class="flex gap-3">
        <button onclick="startClickGame()" class="flex-1 py-3 bg-white/20 hover:bg-white/30 text-white rounded-xl font-bold transition">
          🔄 再連點一次
        </button>
        <button id="next-boxing-btn" onclick="switchToBoxing()" class="flex-1 py-3 bg-gradient-to-r from-rose-400 to-amber-300 text-purple-950 rounded-xl font-black shadow-lg hover:brightness-110 transition">
          🥊 進入拳擊擂台
        </button>
      </div>
    </div>
  </div>


  <!-- ================= 遊戲 2：火柴人拳擊擂台 ================= -->
  <div id="game2-container" class="hidden w-full max-w-2xl glass-card rounded-3xl p-6 md:p-8 text-center relative z-10">
    <div class="flex justify-between items-center mb-3">
      <span class="bg-rose-500/80 text-white font-extrabold px-4 py-1 rounded-full text-xs shadow">
        🥊 第二關：拳擊擂台
      </span>
      <p class="text-white/90 text-xs font-bold">點擊畫面或按 Space 空白鍵出拳！</p>
    </div>

    <!-- 拳擊看板 -->
    <div class="flex justify-between items-center bg-black/30 rounded-2xl p-3 mb-4 backdrop-blur-sm border border-white/20">
      <div class="text-left">
        <p class="text-xs text-pink-300 font-bold">👑 玩家 (藍頭帶)</p>
        <p id="box-p-score" class="text-2xl font-black text-white">0 拳</p>
      </div>
      <div class="text-center">
        <p class="text-xs text-white/70 font-bold">倒數</p>
        <p id="box-timer" class="text-3xl font-black text-amber-300">10.0s</p>
      </div>
      <div class="text-right">
        <p class="text-xs text-cyan-300 font-bold">🤖 AI (6 CPS)</p>
        <p id="box-ai-score" class="text-2xl font-black text-white">0 拳</p>
      </div>
    </div>

    <!-- Canvas 拳擊擂台繪製 -->
    <div class="relative w-full h-64 md:h-72 bg-gradient-to-b from-indigo-900/60 to-purple-950/80 rounded-2xl overflow-hidden border-2 border-white/30 shadow-inner cursor-pointer flex items-center justify-center" id="boxing-canvas-wrap">
      <canvas id="boxingCanvas" class="w-full h-full absolute inset-0"></canvas>
      
      <!-- 倒數計時遮罩大字 -->
      <div id="boxing-countdown-overlay" class="hidden absolute inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-20">
        <span id="boxing-countdown-text" class="text-7xl font-black text-amber-300 drop-shadow-2xl animate-ping">
          3
        </span>
      </div>
    </div>

    <!-- 開始/重來按鈕 -->
    <button id="box-start-btn" onclick="prepareBoxingGame()" class="w-full mt-4 py-3.5 rounded-2xl bg-gradient-to-r from-rose-400 via-pink-400 to-amber-300 text-purple-950 font-black text-xl shadow-lg hover:brightness-110 active:scale-98 transition">
      🥊 開始拳擊對決
    </button>
  </div>

  <!-- 拳擊 - KO 結算彈窗 -->
  <div id="box-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="glass-card max-w-md w-full rounded-3xl p-8 text-center text-white border border-white/50 shadow-2xl">
      <p id="box-ko-title" class="text-2xl font-black text-amber-300 tracking-wider mb-1">KO! 擂台結果</p>
      <h2 id="box-banner" class="text-5xl font-black my-4 tracking-wider drop-shadow-lg">VICTORY</h2>
      <p id="box-sub-text" class="text-lg font-bold text-white/90 mb-6">一拳將對方打倒在地！</p>
      
      <div class="flex gap-3">
        <button onclick="backToClickGame()" class="flex-1 py-3 bg-white/20 hover:bg-white/30 text-white rounded-xl font-bold transition">
          ✨ 重玩連點遊戲
        </button>
        <button onclick="prepareBoxingGame()" class="flex-1 py-3 bg-gradient-to-r from-rose-500 to-pink-500 text-white rounded-xl font-black shadow-lg hover:brightness-110 transition">
          🥊 再打一局拳擊
        </button>
      </div>
    </div>
  </div>


  <!-- ================= JavaScript 邏輯 ================= -->
  <script>
    /* ================= 遊戲 1：夢幻連點邏輯 ================= */
    let clickDuration = 10;
    let clickTimeLeft = clickDuration;
    let playerClicks = 0;
    let aiClicks = 0;
    let clickTimer = null;
    let isClicking = false;
    let combo = 0;
    let comboTimer = null;

    const timerEl = document.getElementById('timer');
    const playerCpsEl = document.getElementById('player-cps');
    const aiCpsEl = document.getElementById('ai-cps');
    const playerScoreEl = document.getElementById('player-score');
    const aiScoreEl = document.getElementById('ai-score');
    const playerBar = document.getElementById('player-bar');
    const aiBar = document.getElementById('ai-bar');
    const clickArea = document.getElementById('click-area');
    const clickBtnText = document.getElementById('click-btn-text');
    const comboBadge = document.getElementById('combo-badge');
    const startBtn = document.getElementById('start-btn');
    const clickModal = document.getElementById('click-modal');

    function startClickGame() {
      clickModal.classList.add('hidden');
      playerClicks = 0;
      aiClicks = 0;
      clickTimeLeft = clickDuration;
      combo = 0;
      
      updateClickUI();
      startBtn.disabled = true;
      startBtn.classList.add('opacity-50');
      
      let countdown = 3;
      clickBtnText.innerText = `準備: ${countdown}`;
      
      const cdInterval = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          clickBtnText.innerText = `準備: ${countdown}`;
        } else {
          clearInterval(cdInterval);
          clickBtnText.innerText = '💖 猛烈連點我！ 💖';
          clickArea.disabled = false;
          isClicking = true;
          
          clickTimer = setInterval(() => {
            clickTimeLeft -= 0.1;
            
            // AI 電腦模擬：每秒約 5 下 (每 0.1 秒 50% 機率加 1 下)
            if (Math.random() < 0.50) {
              aiClicks++;
            }

            if (clickTimeLeft <= 0) {
              clickTimeLeft = 0;
              endClickGame();
            }
            updateClickUI();
          }, 100);
        }
      }, 1000);
    }

    clickArea.addEventListener('pointerdown', (e) => {
      if (!isClicking) return;
      playerClicks++;
      combo++;
      
      // Combo 動畫
      clearTimeout(comboTimer);
      comboBadge.classList.remove('hidden');
      comboBadge.innerText = `COMBO x${combo} 🔥`;
      comboTimer = setTimeout(() => { combo = 0; comboBadge.classList.add('hidden'); }, 600);

      // 產生點擊夢幻粒子
      createParticle(e.clientX, e.clientY);
      updateClickUI();
    });

    function createParticle(x, y) {
      const p = document.createElement('div');
      p.className = 'particle';
      const symbols = ['💖', '✨', '🌸', '⭐', '+1'];
      p.innerText = symbols[Math.floor(Math.random() * symbols.length)];
      p.style.left = `${x}px`;
      p.style.top = `${y}px`;
      p.style.color = ['#f472b6', '#fbbf24', '#38bdf8', '#c084fc'][Math.floor(Math.random()*4)];
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 800);
    }

    function updateClickUI() {
      timerEl.innerText = `${clickTimeLeft.toFixed(1)}s`;
      playerScoreEl.innerText = `${playerClicks} 次`;
      aiScoreEl.innerText = `${aiClicks} 次`;

      const elapsed = clickDuration - clickTimeLeft;
      playerCpsEl.innerText = elapsed > 0 ? (playerClicks / elapsed).toFixed(1) : '0.0';
      aiCpsEl.innerText = elapsed > 0 ? (aiClicks / elapsed).toFixed(1) : '0.0';

      const maxScore = Math.max(playerClicks, aiClicks, 20);
      playerBar.style.width = `${Math.min((playerClicks / maxScore) * 100, 100)}%`;
      aiBar.style.width = `${Math.min((aiClicks / maxScore) * 100, 100)}%`;
    }

    function endClickGame() {
      isClicking = false;
      clearInterval(clickTimer);
      clickArea.disabled = true;
      startBtn.disabled = false;
      startBtn.classList.remove('opacity-50');
      clickBtnText.innerText = '比賽結束！';

      const diff = playerClicks - aiClicks;
      document.getElementById('final-player').innerText = `${playerClicks} 次`;
      document.getElementById('final-ai').innerText = `${aiClicks} 次`;

      if (diff > 0) {
        document.getElementById('result-emoji').innerText = '👑';
        document.getElementById('result-title').innerText = '你大獲全勝！';
        document.getElementById('final-diff').innerText = `贏了 ${diff} 下！`;
      } else if (diff < 0) {
        document.getElementById('result-emoji').innerText = '🤖';
        document.getElementById('result-title').innerText = '電腦獲勝了！';
        document.getElementById('final-diff').innerText = `輸了 ${Math.abs(diff)} 下`;
      } else {
        document.getElementById('result-emoji').innerText = '🤝';
        document.getElementById('result-title').innerText = '勢均力敵！';
        document.getElementById('final-diff').innerText = '平手';
      }

      clickModal.classList.remove('hidden');
    }

    function switchToBoxing() {
      clickModal.classList.add('hidden');
      document.getElementById('game1-container').classList.add('hidden');
      document.getElementById('game2-container').classList.remove('hidden');
      initBoxingCanvas();
    }

    function backToClickGame() {
      document.getElementById('box-modal').classList.add('hidden');
      document.getElementById('game2-container').classList.add('hidden');
      document.getElementById('game1-container').classList.remove('hidden');
    }


    /* ================= 遊戲 2：火柴人拳擊邏輯 ================= */
    let canvas, ctx;
    let boxTimer = null;
    let boxTimeLeft = 10;
    let boxPlaying = false;
    let pPunchCount = 0;
    let aiPunchCount = 0;
    
    // 火柴人狀態
    let playerStick = { x: 0, y: 0, punch: 0, hit: 0, fallen: false };
    let aiStick = { x: 0, y: 0, punch: 0, hit: 0, fallen: false };

    function initBoxingCanvas() {
      canvas = document.getElementById('boxingCanvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();
      drawStickmen();
    }

    function resizeCanvas() {
      const wrap = document.getElementById('boxing-canvas-wrap');
      if (!wrap || !canvas) return;
      canvas.width = wrap.clientWidth;
      canvas.height = wrap.clientHeight;
      playerStick.x = canvas.width * 0.3;
      playerStick.y = canvas.height * 0.75;
      aiStick.x = canvas.width * 0.7;
      aiStick.y = canvas.height * 0.75;
    }

    window.addEventListener('resize', () => {
      if (!document.getElementById('game2-container').classList.contains('hidden')) {
        resizeCanvas();
        drawStickmen();
      }
    });

    // 拳擊比賽開局 (含 3 秒倒數)
    function prepareBoxingGame() {
      document.getElementById('box-modal').classList.add('hidden');
      pPunchCount = 0;
      aiPunchCount = 0;
      boxTimeLeft = 10.0;
      boxPlaying = false;

      playerStick.fallen = false;
      aiStick.fallen = false;

      document.getElementById('box-p-score').innerText = '0 拳';
      document.getElementById('box-ai-score').innerText = '0 拳';
      document.getElementById('box-timer').innerText = '10.0s';
      
      const startBoxBtn = document.getElementById('box-start-btn');
      startBoxBtn.disabled = true;
      startBoxBtn.classList.add('opacity-50');

      drawStickmen();

      // 3 秒倒數 overlay
      const cdOverlay = document.getElementById('boxing-countdown-overlay');
      const cdText = document.getElementById('boxing-countdown-text');
      cdOverlay.classList.remove('hidden');
      
      let cdCount = 3;
      cdText.innerText = cdCount;

      const prepareTimer = setInterval(() => {
        cdCount--;
        if (cdCount > 0) {
          cdText.innerText = cdCount;
        } else if (cdCount === 0) {
          cdText.innerText = "FIGHT!";
        } else {
          clearInterval(prepareTimer);
          cdOverlay.classList.add('hidden');
          startBoxingGame();
        }
      }, 900);
    }

    function startBoxingGame() {
      boxPlaying = true;

      if (boxTimer) clearInterval(boxTimer);
      boxTimer = setInterval(() => {
        boxTimeLeft -= 0.1;
        
        // 機器人調整為 1 秒 6 下 (6 CPS)
        // 0.1 秒的間隔內有 60% 機率出拳 (0.6 * 10 = 6 次/秒)
        if (Math.random() < 0.60) {
          aiPunch();
        }

        if (boxTimeLeft <= 0) {
          boxTimeLeft = 0;
          endBoxingGame();
        }

        document.getElementById('box-timer').innerText = `${boxTimeLeft.toFixed(1)}s`;
        drawStickmen();
      }, 100);
    }

    function playerPunch() {
      if (!boxPlaying) return;
      pPunchCount++;
      playerStick.punch = 1;
      aiStick.hit = 1;
      document.getElementById('box-p-score').innerText = `${pPunchCount} 拳`;
      createHitEffect(aiStick.x - 20, aiStick.y - 80, 'POW!');
      drawStickmen();
      setTimeout(() => { playerStick.punch = 0; aiStick.hit = 0; drawStickmen(); }, 120);
    }

    function aiPunch() {
      if (!boxPlaying) return;
      aiPunchCount++;
      aiStick.punch = 1;
      playerStick.hit = 1;
      document.getElementById('box-ai-score').innerText = `${aiPunchCount} 拳`;
      createHitEffect(playerStick.x + 20, playerStick.y - 80, 'HIT!');
      drawStickmen();
      setTimeout(() => { aiStick.punch = 0; playerStick.hit = 0; drawStickmen(); }, 120);
    }

    // 鍵盤與點擊事件綁定
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && boxPlaying) {
        e.preventDefault();
        playerPunch();
      }
    });

    document.getElementById('boxing-canvas-wrap')?.addEventListener('pointerdown', () => {
      if (boxPlaying) playerPunch();
    });

    function createHitEffect(x, y, text) {
      const wrap = document.getElementById('boxing-canvas-wrap');
      const hit = document.createElement('div');
      hit.className = 'hit-text text-yellow-300 drop-shadow-md';
      hit.innerText = text;
      hit.style.left = `${x}px`;
      hit.style.top = `${y}px`;
      wrap.appendChild(hit);
      setTimeout(() => hit.remove(), 500);
    }

    function drawStickmen() {
      if (!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 繪製地面
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height * 0.78);
      ctx.lineTo(canvas.width, canvas.height * 0.78);
      ctx.stroke();

      // 繪製玩家火柴人 (藍色團隊)
      drawSingleStickman(playerStick.x, playerStick.y, true, playerStick.punch, playerStick.hit, playerStick.fallen);
      
      // 繪製 AI 火柴人 (紅色團隊)
      drawSingleStickman(aiStick.x, aiStick.y, false, aiStick.punch, aiStick.hit, aiStick.fallen);
    }

    function drawSingleStickman(x, y, isPlayer, isPunching, isHit, isFallen) {
      ctx.save();
      ctx.translate(x, y);

      // 被倒地 KO 動畫
      if (isFallen) {
        ctx.rotate(isPlayer ? -Math.PI / 2 : Math.PI / 2);
        ctx.translate(0, 20);
      } else if (isHit) {
        ctx.translate(isPlayer ? -10 : 10, 0);
      }

      const bodyColor = '#ffffff';
      const gloveColor = isPlayer ? '#38bdf8' : '#f43f5e';

      // 頭部
      ctx.strokeStyle = bodyColor;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, -70, 16, 0, Math.PI * 2);
      ctx.stroke();

      // 頭帶
      ctx.strokeStyle = gloveColor;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, -72, 17, Math.PI * 0.8, Math.PI * 0.2);
      ctx.stroke();

      // 身體
      ctx.strokeStyle = bodyColor;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, -54);
      ctx.lineTo(0, -10);
      ctx.stroke();

      // 雙腿
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.lineTo(-15, 15);
      ctx.moveTo(0, -10);
      ctx.lineTo(15, 15);
      ctx.stroke();

      // 手臂與拳擊手套
      ctx.beginPath();
      if (isPunching) {
        // 出拳手臂伸長
        const punchX = isPlayer ? 45 : -45;
        ctx.moveTo(0, -40);
        ctx.lineTo(punchX, -40);
        ctx.stroke();

        // 拳擊手套
        ctx.fillStyle = gloveColor;
        ctx.beginPath();
        ctx.arc(punchX + (isPlayer ? 8 : -8), -40, 10, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // 防守姿態
        ctx.moveTo(0, -40);
        ctx.lineTo(isPlayer ? 15 : -15, -35);
        ctx.stroke();

        ctx.fillStyle = gloveColor;
        ctx.beginPath();
        ctx.arc(isPlayer ? 15 : -15, -35, 9, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function endBoxingGame() {
      boxPlaying = false;
      clearInterval(boxTimer);
      document.getElementById('box-start-btn').disabled = false;
      document.getElementById('box-start-btn').classList.remove('opacity-50');

      const banner = document.getElementById('box-banner');
      const subText = document.getElementById('box-sub-text');

      if (pPunchCount > aiPunchCount) {
        aiStick.fallen = true;
        playerStick.punch = 1;
        banner.innerText = "VICTORY";
        banner.className = "text-5xl font-black my-4 text-amber-300 drop-shadow-lg";
        subText.innerText = "一拳重擊將 AI 打倒在地！";
      } else if (aiPunchCount > pPunchCount) {
        playerStick.fallen = true;
        aiStick.punch = 1;
        banner.innerText = "YOU LOST";
        banner.className = "text-5xl font-black my-4 text-rose-400 drop-shadow-lg";
        subText.innerText = "可惜！被 6 CPS 機器人一拳 KO！";
      } else {
        banner.innerText = "DRAW";
        banner.className = "text-5xl font-black my-4 text-cyan-300 drop-shadow-lg";
        subText.innerText = "兩人同時重擊，不分勝負！";
      }

      drawStickmen();

      setTimeout(() => {
        document.getElementById('box-modal').classList.remove('hidden');
      }, 700);
    }
  </script>
</body>
