<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>夢幻手速大決鬥 - 10秒人機對對碰</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Quicksand & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background: linear-gradient(135deg, #1e1b4b 0%, #311042 40%, #2e1065 70%, #1e1b4b 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景飄浮星光動畫 */
        @keyframes starFloat {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-15px) rotate(180deg); opacity: 0.8; }
            100% { transform: translateY(0px) rotate(360deg); opacity: 0.3; }
        }

        .star-bg {
            position: absolute;
            pointer-events: none;
            animation: starFloat 6s ease-in-out infinite;
        }

        /* 點擊按鈕心跳脈衝 */
        @keyframes pulseDream {
            0% { transform: scale(1); box-shadow: 0 0 35px rgba(244, 114, 182, 0.6), 0 0 15px rgba(192, 132, 252, 0.4); }
            50% { transform: scale(0.93); box-shadow: 0 0 50px rgba(244, 114, 182, 0.9), 0 0 25px rgba(192, 132, 252, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 35px rgba(244, 114, 182, 0.6), 0 0 15px rgba(192, 132, 252, 0.4); }
        }

        .dream-clicking {
            animation: pulseDream 0.12s ease-out;
        }

        /* 夢幻浮動粒子動畫 */
        @keyframes floatParticle {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
            }
            50% {
                opacity: 0.9;
                transform: translate(calc(-50% + var(--dx)), calc(-50% - 80px)) scale(1.4) rotate(var(--rot));
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--dx)*1.5), calc(-50% - 150px)) scale(0.8) rotate(calc(var(--rot)*2));
            }
        }

        .dream-particle {
            position: fixed;
            pointer-events: none;
            font-size: 1.5rem;
            animation: floatParticle 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            z-index: 100;
            filter: drop-shadow(0 0 8px rgba(244, 114, 182, 0.8));
        }

        /* 毛玻璃與發光樣式 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .glass-modal {
            background: rgba(30, 20, 50, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(244, 114, 182, 0.3);
        }

        /* 夢幻漸層進度條 glow */
        .glow-pink {
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.6);
        }
        .glow-cyan {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body class="text-pink-100 flex flex-col items-center justify-between p-4 relative select-none">

    <!-- 背景星光背景裝飾 -->
    <div id="starContainer" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- 頂部標題區 -->
    <header class="w-full max-w-lg text-center pt-4 z-10">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-pink-500/10 border border-pink-400/30 text-pink-300 text-xs font-bold mb-2 shadow-sm backdrop-blur">
            <i class="fa-solid fa-sparkles text-yellow-300 animate-pulse"></i> Dreamy Pastel Duel
        </div>
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-wide bg-gradient-to-r from-pink-300 via-purple-300 to-cyan-300 bg-clip-text text-transparent drop-shadow">
            ✨ 夢幻 10 秒連點對決
        </h1>
        <p class="text-xs md:text-sm text-purple-200/80 mt-1">對手 AI 平均速度 ~5 CPS (每秒5下)，準備好綻放你的粉紅手速了嗎？</p>
    </header>

    <!-- 主要遊戲內容區 -->
    <main class="w-full max-w-lg my-auto flex flex-col items-center gap-5 z-10">
        
        <!-- 計時器與領先差距 -->
        <div class="glass-panel rounded-3xl p-4 flex items-center justify-between w-full shadow-2xl">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-pink-500/20 to-purple-500/20 border border-pink-300/30 flex items-center justify-center text-pink-300 text-2xl shadow-inner">
                    <i class="fa-regular fa-hourglass-half"></i>
                </div>
                <div>
                    <div class="text-xs text-purple-200/70 uppercase tracking-widest font-bold">剩餘時間</div>
                    <div id="timerDisplay" class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-300 to-purple-200">10.0s</div>
                </div>
            </div>
            
            <div class="text-right">
                <div class="text-xs text-purple-200/70 uppercase tracking-widest font-bold">領先差距</div>
                <div id="diffDisplay" class="text-xl md:text-2xl font-black text-pink-300">0 下</div>
            </div>
        </div>

        <!-- 對抗進度條卡片 -->
        <div class="w-full glass-panel rounded-3xl p-5 shadow-2xl space-y-4 border border-pink-300/20">
            
            <!-- 玩家進度條 -->
            <div>
                <div class="flex justify-between items-center mb-1.5 text-sm">
                    <span class="font-bold text-pink-300 flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-pink-400"></i> 玩家 (You)
                    </span>
                    <div class="space-x-3 text-xs">
                        <span class="text-purple-200/80">CPS: <span id="playerCps" class="text-pink-300 font-bold">0.0</span></span>
                        <span class="text-xl font-black text-pink-300" id="playerScore">0</span>
                    </div>
                </div>
                <div class="w-full bg-slate-900/40 h-4 rounded-full overflow-hidden p-0.5 border border-pink-300/30 backdrop-blur">
                    <div id="playerBar" class="bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-300 h-full rounded-full transition-all duration-150 w-0 glow-pink"></div>
                </div>
            </div>

            <!-- 電腦 AI 進度條 -->
            <div>
                <div class="flex justify-between items-center mb-1.5 text-sm">
                    <span class="font-bold text-cyan-300 flex items-center gap-2">
                        <i class="fa-solid fa-robot text-cyan-400"></i> 電腦 AI (~5 CPS)
                    </span>
                    <div class="space-x-3 text-xs">
                        <span class="text-purple-200/80">CPS: <span id="aiCps" class="text-cyan-300 font-bold">0.0</span></span>
                        <span class="text-xl font-black text-cyan-300" id="aiScore">0</span>
                    </div>
                </div>
                <div class="w-full bg-slate-900/40 h-4 rounded-full overflow-hidden p-0.5 border border-cyan-300/30 backdrop-blur">
                    <div id="aiBar" class="bg-gradient-to-r from-cyan-500 via-sky-400 to-indigo-400 h-full rounded-full transition-all duration-150 w-0 glow-cyan"></div>
                </div>
            </div>

        </div>

        <!-- 夢幻點擊核心按鈕 -->
        <div class="relative flex items-center justify-center my-2 w-full">
            <button id="clickBtn" disabled 
                class="w-56 h-56 md:w-64 md:h-64 rounded-full bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-400 hover:from-pink-400 hover:to-indigo-300 text-white font-extrabold text-2xl md:text-3xl border-4 border-pink-200/40 flex flex-col items-center justify-center shadow-2xl transition-all duration-75 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed outline-none relative overflow-hidden group">
                <!-- 按鈕內柔光微粒 -->
                <div class="absolute inset-0 bg-white/10 rounded-full opacity-0 group-hover:opacity-100 transition-opacity"></div>
                
                <i class="fa-solid fa-heart text-5xl md:text-6xl mb-2 text-pink-200 animate-bounce drop-shadow"></i>
                <span id="btnText" class="tracking-wider">點擊開始比賽</span>
                <span id="comboText" class="text-xs text-pink-200/90 mt-1 font-normal opacity-0 tracking-widest">✨ Tap Tap! ✨</span>
            </button>
        </div>

        <!-- 開始按鈕 -->
        <button id="startBtn" onclick="prepareStart()" 
            class="px-10 py-4 bg-gradient-to-r from-pink-400 via-purple-400 to-cyan-400 hover:from-pink-300 hover:to-cyan-300 text-slate-900 font-black text-lg rounded-full shadow-lg transition-all transform hover:scale-105 active:scale-95 flex items-center gap-2 border border-white/40">
            <i class="fa-solid fa-play"></i> 開始夢幻比賽
        </button>

    </main>

    <!-- 頁尾 -->
    <footer class="text-xs text-purple-300/60 py-2 z-10">
        Dreamy Clicker Game &copy; 10-Second Pastel Battle
    </footer>

    <!-- 開局倒數 3 秒遮罩 -->
    <div id="countdownModal" class="fixed inset-0 bg-indigo-950/80 backdrop-blur-md hidden z-50 flex flex-col items-center justify-center">
        <div class="text-pink-200 text-xl font-bold mb-4 tracking-widest">✨ 準備開始浪漫對決 ✨</div>
        <div id="countdownNum" class="text-8xl md:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-300 via-purple-300 to-cyan-300 animate-ping">
            3
        </div>
    </div>

    <!-- 夢幻結算面板 (Modal) -->
    <div id="resultModal" class="fixed inset-0 bg-indigo-950/75 backdrop-blur-lg hidden z-50 flex items-center justify-center p-4">
        <div class="glass-modal rounded-3xl p-6 md:p-8 max-w-md w-full text-center shadow-2xl relative overflow-hidden transform transition-all scale-95 border border-pink-300/40">
            
            <!-- 結算頂部徽章 -->
            <div id="resultBadge" class="w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 bg-pink-500/20 text-pink-300 border border-pink-300/40 shadow-lg">
                <i class="fa-solid fa-crown"></i>
            </div>

            <h2 id="resultTitle" class="text-3xl font-black text-white mb-1">比賽結束！</h2>
            <p id="resultSubtitle" class="text-pink-200/80 text-sm mb-6">夢幻對決成果統計</p>

            <!-- 詳細數據卡片 -->
            <div class="bg-indigo-900/40 rounded-2xl p-4 border border-pink-300/20 space-y-3 mb-6 text-sm">
                <div class="flex justify-between items-center border-b border-pink-300/10 pb-2">
                    <span class="text-purple-200/80 flex items-center gap-2"><i class="fa-solid fa-user text-pink-400"></i>你的點擊數</span>
                    <span id="resPlayerClicks" class="font-extrabold text-pink-300 text-lg">0 次</span>
                </div>
                <div class="flex justify-between items-center border-b border-pink-300/10 pb-2">
                    <span class="text-purple-200/80 flex items-center gap-2"><i class="fa-solid fa-robot text-cyan-400"></i>AI 點擊數</span>
                    <span id="resAiClicks" class="font-extrabold text-cyan-300 text-lg">0 次</span>
                </div>
                <div class="flex justify-between items-center border-b border-pink-300/10 pb-2">
                    <span class="text-purple-200/80 flex items-center gap-2"><i class="fa-solid fa-bolt text-yellow-300"></i>你的平均 CPS</span>
                    <span id="resPlayerAvgCps" class="font-bold text-purple-200">0.0 次/秒</span>
                </div>
                <div class="flex justify-between items-center pt-1">
                    <span class="text-pink-100 font-bold">對決結果</span>
                    <span id="resDiffText" class="font-black text-xl text-pink-300">贏了 0 次</span>
                </div>
            </div>

            <!-- 重新挑戰按鈕 -->
            <button onclick="closeResultAndRestart()" 
                class="w-full py-4 bg-gradient-to-r from-pink-400 via-purple-400 to-cyan-400 hover:from-pink-300 hover:to-cyan-300 text-slate-900 font-black text-lg rounded-2xl shadow-xl transition-all active:scale-95 border border-white/50">
                <i class="fa-solid fa-rotate-right mr-2"></i>再挑戰一次
            </button>
        </div>
    </div>

    <script>
        // --- 遊戲狀態與參數 ---
        const GAME_DURATION = 10; // 10秒限時
        const AI_TARGET_CPS = 5.0; // AI 約 5 CPS

        let playerClicks = 0;
        let aiClicks = 0;
        let timeLeft = GAME_DURATION;
        let isGameRunning = false;
        
        let timerInterval = null;
        let aiInterval = null;
        let cpsCalculatorInterval = null;

        let playerRecentClicks = [];
        let aiRecentClicks = [];

        // 夢幻符號庫
        const dreamSymbols = ['💖', '✨', '🌸', '⭐', '🦄', '🎀', '💫', '💎'];

        // --- DOM 元素引用 ---
        const clickBtn = document.getElementById('clickBtn');
        const startBtn = document.getElementById('startBtn');
        const btnText = document.getElementById('btnText');
        const comboText = document.getElementById('comboText');
        const timerDisplay = document.getElementById('timerDisplay');
        const diffDisplay = document.getElementById('diffDisplay');

        const playerScoreEl = document.getElementById('playerScore');
        const aiScoreEl = document.getElementById('aiScore');
        const playerBar = document.getElementById('playerBar');
        const aiBar = document.getElementById('aiBar');
        const playerCpsEl = document.getElementById('playerCps');
        const aiCpsEl = document.getElementById('aiCps');

        const countdownModal = document.getElementById('countdownModal');
        const countdownNum = document.getElementById('countdownNum');

        const resultModal = document.getElementById('resultModal');
        const resultBadge = document.getElementById('resultBadge');
        const resultTitle = document.getElementById('resultTitle');
        const resultSubtitle = document.getElementById('resultSubtitle');
        const resPlayerClicks = document.getElementById('resPlayerClicks');
        const resAiClicks = document.getElementById('resAiClicks');
        const resPlayerAvgCps = document.getElementById('resPlayerAvgCps');
        const resDiffText = document.getElementById('resDiffText');

        // 生成背景裝飾星光
        function initStarBg() {
            const container = document.getElementById('starContainer');
            for (let i = 0; i < 25; i++) {
                const star = document.createElement('div');
                star.className = 'star-bg text-pink-200/30';
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.fontSize = `${Math.random() * 1.2 + 0.6}rem`;
                star.style.animationDelay = `${Math.random() * 5}s`;
                star.style.animationDuration = `${Math.random() * 4 + 4}s`;
                star.innerText = Math.random() > 0.5 ? '✦' : '✧';
                container.appendChild(star);
            }
        }

        // --- 玩家點擊觸發 ---
        clickBtn.addEventListener('pointerdown', (e) => {
            if (!isGameRunning) return;
            
            playerClicks++;
            playerRecentClicks.push(Date.now());

            triggerBtnAnimation();
            spawnDreamParticle(e.clientX, e.clientY);
            updateDisplay();
        });

        // 按鈕點擊動畫
        function triggerBtnAnimation() {
            clickBtn.classList.remove('dream-clicking');
            void clickBtn.offsetWidth;
            clickBtn.classList.add('dream-clicking');
        }

        // 產生夢幻粒子爆發特效
        function spawnDreamParticle(x, y) {
            // 若無座標則定位在按鈕中央
            if (!x || !y) {
                const rect = clickBtn.getBoundingClientRect();
                x = rect.left + rect.width / 2;
                y = rect.top + rect.height / 2;
            }

            // 一次產生 2~3 個夢幻粒子
            const count = Math.floor(Math.random() * 2) + 2;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'dream-particle';
                p.innerText = dreamSymbols[Math.floor(Math.random() * dreamSymbols.length)];
                
                // 隨機角度與距離
                const dx = (Math.random() - 0.5) * 120;
                const rot = (Math.random() - 0.5) * 180;

                p.style.setProperty('--dx', `${dx}px`);
                p.style.setProperty('--rot', `${rot}deg`);
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;

                document.body.appendChild(p);
                setTimeout(() => p.remove(), 750);
            }
        }

        // --- 倒數 3 秒開局 ---
        function prepareStart() {
            resetGameData();
            startBtn.classList.add('hidden');
            countdownModal.classList.remove('hidden');

            let count = 3;
            countdownNum.innerText = count;

            const countTimer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownNum.innerText = count;
                    countdownNum.classList.remove('animate-ping');
                    void countdownNum.offsetWidth;
                    countdownNum.classList.add('animate-ping');
                } else {
                    clearInterval(countTimer);
                    countdownModal.classList.add('hidden');
                    startGame();
                }
            }, 1000);
        }

        // --- 開始比賽 ---
        function startGame() {
            isGameRunning = true;
            clickBtn.disabled = false;
            btnText.innerText = "全力連點！";
            comboText.classList.remove('opacity-0');

            const startTime = Date.now();

            // 主計時器
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                timeLeft = Math.max(0, GAME_DURATION - elapsed);
                timerDisplay.innerText = `${timeLeft.toFixed(1)}s`;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 100);

            // AI 自動點擊 (平均 ~5 CPS，隨機波動 ±35ms)
            function scheduleAiClick() {
                if (!isGameRunning) return;
                const delay = 200 + (Math.random() * 70 - 35);
                
                aiInterval = setTimeout(() => {
                    if (isGameRunning) {
                        aiClicks++;
                        aiRecentClicks.push(Date.now());
                        updateDisplay();
                        scheduleAiClick();
                    }
                }, delay);
            }
            scheduleAiClick();

            // 即時 CPS 計算 (過去1秒)
            cpsCalculatorInterval = setInterval(() => {
                const now = Date.now();
                playerRecentClicks = playerRecentClicks.filter(t => now - t <= 1000);
                aiRecentClicks = aiRecentClicks.filter(t => now - t <= 1000);

                playerCpsEl.innerText = playerRecentClicks.length.toFixed(1);
                aiCpsEl.innerText = aiRecentClicks.length.toFixed(1);
            }, 200);
        }

        // --- 更新介面數值與進度條 ---
        function updateDisplay() {
            playerScoreEl.innerText = playerClicks;
            aiScoreEl.innerText = aiClicks;

            const diff = playerClicks - aiClicks;
            if (diff > 0) {
                diffDisplay.innerText = `+${diff} 下`;
                diffDisplay.className = "text-xl md:text-2xl font-black text-pink-300 drop-shadow";
            } else if (diff < 0) {
                diffDisplay.innerText = `${diff} 下`;
                diffDisplay.className = "text-xl md:text-2xl font-black text-cyan-300 drop-shadow";
            } else {
                diffDisplay.innerText = `0 下`;
                diffDisplay.className = "text-xl md:text-2xl font-black text-purple-200/80";
            }

            const maxVal = Math.max(playerClicks, aiClicks, 25);
            playerBar.style.width = `${Math.min(100, (playerClicks / maxVal) * 100)}%`;
            aiBar.style.width = `${Math.min(100, (aiClicks / maxVal) * 100)}%`;
        }

        // 重置數據
        function resetGameData() {
            playerClicks = 0;
            aiClicks = 0;
            timeLeft = GAME_DURATION;
            playerRecentClicks = [];
            aiRecentClicks = [];

            timerDisplay.innerText = `${GAME_DURATION.toFixed(1)}s`;
            playerCpsEl.innerText = "0.0";
            aiCpsEl.innerText = "0.0";
            btnText.innerText = "準備好連點";
            comboText.classList.add('opacity-0');

            updateDisplay();
        }

        // 結束遊戲與顯示結算面板
        function endGame() {
            isGameRunning = false;
            clickBtn.disabled = true;
            btnText.innerText = "時間到！";
            comboText.classList.add('opacity-0');

            clearInterval(timerInterval);
            clearTimeout(aiInterval);
            clearInterval(cpsCalculatorInterval);

            const diff = playerClicks - aiClicks;
            const playerAvgCps = (playerClicks / GAME_DURATION).toFixed(1);

            resPlayerClicks.innerText = `${playerClicks} 次`;
            resAiClicks.innerText = `${aiClicks} 次`;
            resPlayerAvgCps.innerText = `${playerAvgCps} 次/秒`;

            if (diff > 0) {
                resultBadge.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 bg-pink-500/20 text-pink-300 border border-pink-300/50 shadow-lg glow-pink";
                resultBadge.innerHTML = '<i class="fa-solid fa-crown"></i>';
                resultTitle.innerText = "💖 夢幻大獲全勝！";
                resultSubtitle.innerText = "太厲害了！你的手速成功戰勝了電腦！";
                resDiffText.className = "font-black text-xl text-pink-300";
                resDiffText.innerText = `大幅領先 ${diff} 次點擊！`;
            } else if (diff < 0) {
                resultBadge.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 bg-cyan-500/20 text-cyan-300 border border-cyan-300/50 shadow-lg glow-cyan";
                resultBadge.innerHTML = '<i class="fa-solid fa-robot"></i>';
                resultTitle.innerText = "✨ 差一點就贏了！";
                resultSubtitle.innerText = "電腦 AI 的速度稍微快了一點點！";
                resDiffText.className = "font-black text-xl text-cyan-300";
                resDiffText.innerText = `落後 AI ${Math.abs(diff)} 次點擊`;
            } else {
                resultBadge.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 bg-purple-500/20 text-purple-300 border border-purple-300/50 shadow-lg";
                resultBadge.innerHTML = '<i class="fa-solid fa-sparkles"></i>';
                resultTitle.innerText = "🌸 默契平手！";
                resultSubtitle.innerText = "你與 AI 的連點速度完美一致！";
                resDiffText.className = "font-black text-xl text-purple-200";
                resDiffText.innerText = "雙方平分秋色";
            }

            setTimeout(() => {
                resultModal.classList.remove('hidden');
            }, 300);
        }

        // 關閉結算彈窗並重置
        function closeResultAndRestart() {
            resultModal.classList.add('hidden');
            startBtn.classList.remove('hidden');
            resetGameData();
        }

        // 初始化星光背景
        window.onload = initStarBg;
    </script>
</body>
</html>
